aid: redefine-meat
name: Redefine Meat
description: >-
  Redefine Meat is an Israeli food-technology company, founded in 2018, that manufactures
  plant-based whole-cut meat alternatives it markets as New-Meat, using proprietary industrial
  3D printing together with plant-protein formulations it calls Alt-Muscle, Alt-Fat and
  Alt-Blood. Its range spans steaks, burgers, shawarma, beef mince, lamb kofta, pulled beef and
  bratwurst across consumer (B2C) and foodservice (B2B / PRO) lines, sold through restaurants,
  hotels, caterers and retail in the United Kingdom, Germany, the Netherlands, France and
  Israel. Redefine Meat operates no developer program, but its own website at
  www.redefinemeat.com runs on WordPress and WooCommerce and exposes a genuinely public,
  machine-readable API surface: a WordPress REST API discovery index advertising 845 routes
  across 30 namespaces, an anonymously readable WooCommerce Store API for products, categories
  and cart, and two OAuth-gated Model Context Protocol endpoints advertised through RFC 8414
  and RFC 9728 well-known metadata.
