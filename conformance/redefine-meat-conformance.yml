  program is published.
standards:
- id: rfc8414-oauth-authorization-server-metadata
  conforms: true
  evidence: >-
    /.well-known/oauth-authorization-server returns a valid RFC 8414 document with issuer,
    authorization_endpoint, token_endpoint, revocation_endpoint, response_types_supported,
    grant_types_supported, code_challenge_methods_supported and scopes_supported.
- id: rfc9728-oauth-protected-resource-metadata
  conforms: true
  evidence: >-
    /.well-known/oauth-protected-resource returns resource, authorization_servers,
    bearer_methods_supported and scopes_supported for the MCP endpoint.
- id: oauth2
  conforms: true
  evidence: authorization_code + refresh_token grants advertised at /oauth/authorize and /oauth/token.
- id: oauth21-pkce
  conforms: true
  evidence: >-
    code_challenge_methods_supported = [S256] with token_endpoint_auth_methods_supported = [none],
    i.e. public clients with mandatory PKCE, the OAuth 2.1 / MCP authorization profile.
- id: mcp-model-context-protocol
  conforms: partial
  evidence: >-
    Two JSON-RPC MCP endpoints are served and advertised via RFC 9728, but the protocol handshake
    could not be completed anonymously (HTTP 401), so protocolVersion and capabilities are unverified.
- id: rfc8615-well-known-uris
  conforms: partial
  evidence: >-
    The two OAuth documents are served correctly under /.well-known/, but the host answers HTTP 200
    with its theme homepage for every other /.well-known/ path, which defeats well-known discovery
    for any client that trusts the status code.
- id: rfc8288-web-linking
  conforms: true
  evidence: 'Collection responses carry a Link header with rel="next"/"prev".'
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Errors use the WordPress envelope {code, message, data.status} with content-type
    application/json, not application/problem+json.
- id: openapi
  conforms: false
