summary: >-
  Redefine Meat runs both a REST surface (WordPress REST API, 845 routes across 30 namespaces,
  publicly discoverable at /wp-json/) and two MCP endpoints on the same host. The crosswalk
  between them cannot be populated: tools/list on both MCP servers returns HTTP 401, so no tool
  names, descriptions or inputSchemas are observable anonymously. Nothing is mapped here by
  guesswork - crosswalk[] is empty because the MCP side is unknown, not because it is empty.
