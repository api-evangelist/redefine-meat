tools:
  status: unknown
  reason: >-
    tools/list requires an OAuth bearer token with the `mcp` scope. No tool names, descriptions
    or inputSchemas were observable anonymously and none are recorded here. Reading them requires
    authenticated introspection with credentials API Evangelist does not hold and will not obtain.
backing_surface:
  note: >-
    The MCP servers sit on the same WordPress installation as the WP Abilities API
    (/wp-json/wp-abilities/v1/abilities, also HTTP 401 anonymously), which is the mechanism
    WordPress MCP adapters use to expose abilities as MCP tools. The abilities registry is
    therefore the most likely tool source, but this was not confirmed and no tools are asserted.
