summary: >-
  www.redefinemeat.com serves two live Model Context Protocol endpoints from its WordPress
  installation, advertised through RFC 9728 OAuth 2.0 Protected Resource Metadata at
  /.well-known/oauth-protected-resource. Both endpoints are OAuth-gated: an anonymous
  JSON-RPC initialize / tools/list returns HTTP 401, so the live tool schemas could not be
  read without credentials. The tool list below is therefore NOT recorded - it is unknown,
  not empty.
servers:
- name: mcp-oauth-server
  transport: http
  url: https://www.redefinemeat.com/wp-json/mcp/mcp-oauth-server
  methods: [POST, GET, DELETE]
  auth: oauth2
  auth_gated: true
  advertised_by: /.well-known/oauth-protected-resource
  probe:
    method: POST
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    http_status: 401
    response: '{"code":"mcp_unauthorized","message":"MCP authentication required.","data":{"status":401}}'
- name: mcp-adapter-default-server
  transport: http
  url: https://www.redefinemeat.com/wp-json/mcp/mcp-adapter-default-server
  methods: [POST, GET, DELETE]
  auth: wordpress-session
  auth_gated: true
  advertised_by: /wp-json/mcp
  probe:
    method: POST
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    http_status: 401
    response: '{"code":"rest_forbidden","message":"Sorry, you are not allowed to do that.","data":{"status":401}}'
